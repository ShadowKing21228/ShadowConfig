plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    shadowCommon ("com.fasterxml.jackson.core:jackson-core:2.19.4")
    shadowCommon ("com.fasterxml.jackson.core:jackson-databind:2.19.4")
    shadowCommon ("com.fasterxml.jackson.core:jackson-annotations:2.19.4")
    shadowCommon ("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.4")
    shadowCommon ("com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.19.4")

    forgeRuntimeLibrary ("com.fasterxml.jackson.core:jackson-core:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.core:jackson-databind:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.core:jackson-annotations:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.19.4")

    implementation "curse.maven:crafttweaker-239197:7298371"

    // JEI для NeoForge (если понадобится)
    // modRuntimeOnly "me.zzp.jei:jei-1.21.1-neoforge:19.21.0.247"

    // REI и зависимости для NeoForge 1.21.1
    modRuntimeOnly "maven.modrinth:rei:16.0.799+neoforge"
    //modRuntimeOnly "curse.maven:roughly-enough-items-hacks-521393:5650171"
    modRuntimeOnly "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'

    from sourceSets.main.output
    from project(":common").sourceSets.main.output

    exclude "META-INF/maven/**"
    exclude "META-INF/scripts/**"

    relocate 'com.fasterxml.jackson', 'net.shadowking21.shadowconfig.shadowlib.jackson'

    relocate 'com.fasterxml.jackson.dataformat.yaml', 'net.shadowking21.shadowconfig.shadowlib.jackson.dataformat.yaml'
    relocate 'org.yaml.snakeyaml',                    'net.shadowking21.shadowconfig.shadowlib.snakeyaml'
}


remapJar {
    input.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
}
